name: Tests

on:
  schedule:
    - cron: '33 5 * * *'
    - cron: '33 17 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'promote') && (github.event.action != 'labeled' || github.event.label.name == 'promote') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main')) && format('{0}-{1}-{2}-{3}', github.workflow, github.event_name, github.ref, github.run_id) || format('{0}-pr-skip-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'promote') && (github.event.action != 'labeled' || github.event.label.name == 'promote') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main')) }}
    runs-on: ubuntu-24.04
    env:
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Create virtualenv
        run: python3 -m venv "$RUNNER_TEMP/venv"
      - name: Install dependencies
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt pytest pytest-cov
      - name: Run tests
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest --cov=. --cov-report=term-missing
