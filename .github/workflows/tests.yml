name: Tests

on:
  schedule:
    - cron: '33 5 * * *'
    - cron: '33 17 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ (github.event_name != 'schedule' || vars.HETZNER_RUNNER == 'true') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'promote') && (github.event.action != 'labeled' || github.event.label.name == 'promote') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main')) && format('{0}-{1}-{2}-{3}', github.workflow, github.event_name, github.ref, github.run_id) || format('{0}-pr-skip-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ (github.event_name != 'schedule' || vars.HETZNER_RUNNER == 'true') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'promote') && (github.event.action != 'labeled' || github.event.label.name == 'promote') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main')) }}
    runs-on: [self-hosted, hetzner]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          pytest --cov=. --cov-report=term-missing
